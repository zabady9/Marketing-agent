services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: analyst-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-analyst}"
      UPLOADS_DIR: "/app/uploads"
      EMBEDDING_MODEL: "BAAI/bge-base-en-v1.5"
    depends_on:
      db:
        condition: service_healthy
    networks: [analyst-net]
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: pgvector/pgvector:pg16
    container_name: analyst-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-changeme}"
      POSTGRES_DB: "${POSTGRES_DB:-analyst}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [analyst-net]
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: analyst-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:5173"
    environment:
      VITE_API_URL: "http://localhost:8001"
      VITE_ADMIN_API_KEY: "${ADMIN_API_KEY}"
    networks: [analyst-net]

networks:
  analyst-net:
    driver: bridge

volumes:
  postgres-data:
  app-logs:
  app-uploads:
